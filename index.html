<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiwi — Script Manager</title>
  <meta name="description" content="Kiwi is a lightweight script manager for TriSparc and its clients. Store, view and analyse video production scripts." />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- ════════════════════════════════════════════
     SIDEBAR OVERLAY
════════════════════════════════════════════ -->
<div id="sidebar-overlay" class="hidden" onclick="closeSidebar()"></div>

<!-- ════════════════════════════════════════════
     SIDEBAR
════════════════════════════════════════════ -->
<nav id="sidebar" role="navigation" aria-label="Main menu">
  <div class="sidebar-header">
    <div class="logo-mark">K</div>
    <span class="logo-name">Kiwi</span>
  </div>
  <div class="sidebar-section-label">Navigation</div>
  <button class="sidebar-item" onclick="closeSidebar(); initDashboard()">
    Projects
  </button>
  <div class="sidebar-divider"></div>
  <button class="sidebar-item danger" onclick="closeSidebar(); signOut().then(()=>initLogin())">
    Sign Out
  </button>
</nav>

<!-- ════════════════════════════════════════════
     TOAST
════════════════════════════════════════════ -->
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<!-- ════════════════════════════════════════════
     VIEW: LOGIN
════════════════════════════════════════════ -->
<div id="view-login" class="view">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-mark" style="width:40px;height:40px;font-size:20px">K</div>
      <div>
        <div class="login-title font-outfit">Kiwi</div>
        <div class="login-sub">Script Manager</div>
      </div>
    </div>
    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input id="email" class="form-input" type="email" autocomplete="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" class="form-input" type="password" autocomplete="current-password" placeholder="••••••••" required />
      </div>
      <p id="login-error" class="form-error"></p>
      <button id="login-btn" class="btn btn-primary btn-full" type="submit" style="margin-top:8px">Sign In</button>
    </form>
  </div>
</div>

<!-- ════════════════════════════════════════════
     VIEW: DASHBOARD (Projects)
════════════════════════════════════════════ -->
<div id="view-dashboard" class="view hidden">
  <header class="app-header">
    <div class="header-logo" onclick="initDashboard()">
      <div class="logo-mark">K</div>
      <span class="logo-name">Kiwi</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="menu-btn-dashboard" onclick="toggleSidebar()" aria-label="Menu">☰</button>
    </div>
  </header>

  <main class="container page-content">
    <h1 class="page-title font-outfit">Projects</h1>
    <div id="project-grid" class="project-grid"></div>
    <div id="projects-empty" class="empty-state hidden">
      <p class="empty-state-text">No projects yet. Create your first project.</p>
    </div>
  </main>

  <!-- FAB: Add Project -->
  <button class="fab" onclick="openAddProject()" aria-label="Add project" title="New Project">+</button>
</div>

<!-- ════════════════════════════════════════════
     VIEW: PROJECT (Script Library)
════════════════════════════════════════════ -->
<div id="view-project" class="view hidden">
  <header class="app-header">
    <div class="header-logo" onclick="initDashboard()">
      <div class="logo-mark">K</div>
      <span class="logo-name">Kiwi</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleSidebar()" aria-label="Menu">☰</button>
    </div>
  </header>

  <main class="container page-content">
    <button class="back-btn" onclick="initDashboard()">← Projects</button>
    <h1 id="project-title" class="page-title font-outfit"></h1>

    <div style="margin-top:16px">
      <div class="search-bar">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="script-search" class="search-input" type="search"
          placeholder="Search spoken text, shot notes, overlays…"
          oninput="state.searchQuery=this.value; renderScripts()" />
      </div>
      <div id="script-list" class="script-list"></div>
      <div id="scripts-empty" class="empty-state hidden">
        <p class="empty-state-text">No scripts yet. Add the first one.</p>
      </div>
    </div>
  </main>

  <!-- FAB: Add Script -->
  <button class="fab" onclick="openAddScript()" aria-label="Add script" title="Add Script">+</button>
</div>

<!-- ════════════════════════════════════════════
     VIEW: SCRIPT VIEWER
════════════════════════════════════════════ -->
<div id="view-script" class="view hidden">
  <header class="app-header">
    <div class="header-logo" onclick="initDashboard()">
      <div class="logo-mark">K</div>
      <span class="logo-name">Kiwi</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleSidebar()" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </header>

  <main class="container page-content">
    <button class="back-btn" onclick="state.currentProject && openProject(state.currentProject.id, state.currentProject.name)">← Back</button>

    <!-- Script header card (coloured, rendered by JS) -->
    <div id="script-header-card" style="margin-bottom:20px"></div>

    <!-- Filter bar: search LEFT, highlight RIGHT -->
    <div class="viewer-toolbar">
      <div class="viewer-search-wrap">
        <svg class="viewer-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="viewer-search" class="viewer-search" type="search"
          placeholder="Search spoken text, shot notes, overlays..."
          oninput="state.searchQuery=this.value; renderScriptView()" />
      </div>
      <div class="viewer-filters" role="group" aria-label="Filter beats">
        <span class="highlight-label">Highlight:</span>
        <button class="filter-btn active" data-filter="all"    onclick="state.filter='all';    renderScriptView()">All</button>
        <button class="filter-btn"        data-filter="spoken" onclick="state.filter='spoken'; renderScriptView()">Spoken</button>
        <button class="filter-btn"        data-filter="text"   onclick="state.filter='text';   renderScriptView()">Text</button>
        <button class="filter-btn"        data-filter="shots"  onclick="state.filter='shots';  renderScriptView()">Shots</button>
      </div>
    </div>

    <!-- Two-column layout -->
    <div class="script-viewer-layout">
      <div id="script-beats" class="script-beats-col"></div>
      <aside id="analytics-panel" class="analytics-col analytics-panel"></aside>
    </div>
  </main>
</div>


<!-- ════════════════════════════════════════════
     MODAL: ADD PROJECT
════════════════════════════════════════════ -->
<div id="modal-add-project" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-project-title">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-project-title" class="modal-title font-outfit">New Project</h2>
      <button class="icon-btn" onclick="closeAddProject()" aria-label="Close">✕</button>
    </div>
    <form id="add-project-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="ap-name">Project Name</label>
        <input id="ap-name" class="form-input" type="text" placeholder="e.g. TriSparc" required />
      </div>
      <p id="add-project-error" class="form-error"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeAddProject()">Cancel</button>
        <button id="save-project-btn" type="submit" class="btn btn-primary">Create</button>
      </div>
    </form>
  </div>
</div>

<!-- ════════════════════════════════════════════
     MODAL: ADD SCRIPT
════════════════════════════════════════════ -->
<div id="modal-add-script" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-script-title">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-script-title" class="modal-title font-outfit">Add Script</h2>
      <button class="icon-btn" onclick="closeAddScript()" aria-label="Close">✕</button>
    </div>
    <form id="add-script-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="as-title">Title</label>
        <input id="as-title" class="form-input" type="text" placeholder="Script title" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="as-short">Short Name</label>
        <input id="as-short" class="form-input" type="text" placeholder="e.g. Hook Video" />
      </div>
      <div class="form-group">
        <label class="form-label" for="as-raw">Script Content</label>
        <textarea id="as-raw" class="form-textarea" placeholder="[0-3s] HOOK&#10;Spoken: Your text here…&#10;On-screen text: BIG TEXT&#10;[SHOT: Camera angle]"></textarea>
      </div>
      <div class="form-group">
        <label class="file-upload-label" for="as-file">
          Upload .txt or .md file
        </label>
        <input id="as-file" type="file" accept=".txt,.md" style="display:none" />
      </div>
      <p id="add-script-error" class="form-error"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeAddScript()">Cancel</button>
        <button id="save-script-btn" type="submit" class="btn btn-primary">Save Script</button>
      </div>
    </form>
  </div>
</div>

<!-- Scripts -->
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/api.js"></script>
<script src="js/parser.js"></script>
<script src="js/app.js"></script>
</body>
</html>
